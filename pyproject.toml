[project]
name = "openevalz-eval-mask"
version = "0.1.0"
description = "OpenEvalz packaging of MASK: Disentangling Honesty from Accuracy in AI Systems"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "mask"
execution_class = "plain"
cost_class = "low"
